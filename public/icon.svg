<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#3B1B2B" />
      <stop offset="58%" stop-color="#22161C" />
      <stop offset="100%" stop-color="#171014" />
    </radialGradient>
    <linearGradient id="goldStroke" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6DEC0" />
      <stop offset="50%" stop-color="#E2B686" />
      <stop offset="100%" stop-color="#C41E68" />
    </linearGradient>
    <linearGradient id="blushPetalL" x1="120" y1="210" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9FB" />
      <stop offset="55%" stop-color="#FAD3E3" />
      <stop offset="100%" stop-color="#E99AC0" />
    </linearGradient>
    <linearGradient id="blushPetalR" x1="392" y1="210" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9FB" />
      <stop offset="55%" stop-color="#FAD3E3" />
      <stop offset="100%" stop-color="#E99AC0" />
    </linearGradient>
    <linearGradient id="roseHeart" x1="256" y1="150" x2="256" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5C9E" />
      <stop offset="48%" stop-color="#C41E68" />
      <stop offset="100%" stop-color="#871045" />
    </linearGradient>
  </defs>

  <!-- Luxury dark plum-espresso backdrop -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect
    x="26"
    y="26"
    width="460"
    height="460"
    rx="92"
    stroke="url(#goldStroke)"
    stroke-opacity="0.45"
    stroke-width="4"
  />

  <!-- Top 4-point beauty glow star -->
  <path
    d="M256 76 C259 98 265 104 287 107 C265 110 259 116 256 138 C253 116 247 110 225 107 C247 104 253 98 256 76 Z"
    fill="#F7DEC0"
  />

  <!-- Delicate gold-rose side calyx petals -->
  <path
    d="M256 360 C206 330 160 274 166 196 C198 206 226 232 246 276 Z"
    fill="#E8C59A"
    fill-opacity="0.72"
  />
  <path
    d="M256 360 C306 330 352 274 346 196 C314 206 286 232 266 276 Z"
    fill="#E8C59A"
    fill-opacity="0.72"
  />

  <!-- Left & right sculpted blush lotus petals -->
  <path
    d="M254 374 C178 368 114 316 106 236 C158 232 208 262 242 326 C248 342 252 358 254 374 Z"
    fill="url(#blushPetalL)"
  />
  <path
    d="M258 374 C334 368 398 316 406 236 C354 232 304 262 270 326 C264 342 260 358 258 374 Z"
    fill="url(#blushPetalR)"
  />

  <!-- Center berry-rose beauty lotus & serum droplet -->
  <path
    d="M256 154 C298 208 318 260 310 314 C304 352 280 376 256 382 C232 376 208 352 202 314 C194 260 214 208 256 154 Z"
    fill="url(#roseHeart)"
  />
  <path
    d="M256 178 C240 212 232 246 236 284 C238 302 244 318 252 328 C234 314 222 292 222 262 C222 228 236 198 256 178 Z"
    fill="#FFF7FA"
    fill-opacity="0.45"
  />

  <!-- Subtle champagne accent arc -->
  <path
    d="M192 406 Q256 430 320 406"
    stroke="#E8C59A"
    stroke-width="8"
    stroke-linecap="round"
  />
</svg>
